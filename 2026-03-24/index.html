// Tab navigation
let currentFilter = 'all';
function showTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.getElementById(tabId).classList.add('fade-in');
  event.target.classList.add('active');
}

// Render papers
function renderPapers(filter, search) {
  const list = document.getElementById('papersList');
  let papers = reportData.papers;
  if (filter !== 'all') papers = papers.filter(p => p.importance === filter);
  if (search) {
    const s = search.toLowerCase();
    papers = papers.filter(p =>
      p.title.toLowerCase().includes(s) ||
      p.summary_ja.includes(s) ||
      p.keywords.some(k => k.toLowerCase().includes(s)) ||
      p.category.includes(s)
    );
  }
  list.innerHTML = papers.map(p => `
    <div class="paper-card fade-in">
      <div class="paper-header">
        <h3><a href="${p.url}" target="_blank">${p.title}</a></h3>
        <span class="importance-badge importance-${p.importance}">${p.importance.toUpperCase()}</span>
      </div>
      <div class="meta">
        <span class="category">${p.category}</span>
        ${p.authors} | ${p.date}${p.arxiv_id ? ' | arXiv:'+p.arxiv_id : ''}
      </div>
      <div class="summary">${p.summary_ja}</div>
      <div class="keywords">${p.keywords.map(k => '<span class="keyword">'+k+'</span>').join('')}</div>
    </div>
  `).join('');
}

function filterPapers() {
  renderPapers(currentFilter, document.getElementById('paperSearch').value);
}
function filterImportance(level, btn) {
  currentFilter = level;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterPapers();
}
